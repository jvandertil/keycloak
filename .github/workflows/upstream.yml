name: Check upstream Keycloak
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Check releases and Quay
        run: python3 scripts/check_upstream.py
      - name: Open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Dockerfile; then exit 0; fi
          tag=$(sed -nE '1s/^FROM quay.io\/keycloak\/keycloak:([^ ]+).*/\1/p' Dockerfile)
          branch="upstream/keycloak-$tag"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add Dockerfile
          git commit -m "Update Keycloak to $tag"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Update Keycloak to $tag" \
            --body "Updates both Keycloak base stages to the verified Quay tag. Review release notes and the image checks before merging. This PR is never auto-merged."
          gh workflow run check.yml --ref "$branch"
